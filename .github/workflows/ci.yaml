---
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a force-push or a follow-up commit supersedes the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/cloudtalk/skills/voice-agent-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validator tests
        run: python3 scripts/test_validate.py
      - name: Docs-sync check
        # Unconditional on purpose: a renamed or deleted checker must fail the build loudly
        # rather than skip itself into a green tick.
        run: python3 scripts/check_docs_sync.py

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on the whole repo
        # Blocking: the credential and large-file hooks are the ones that must not depend on a
        # contributor having installed the git hook locally.
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  grok-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grok-only skills listed in the Grok manifest exist
        # Neither claude plugin validate nor anything else reads .grok-plugin/plugin.json, and
        # xAI's indexer silently drops a "skills" entry whose folder holds no SKILL.md.
        working-directory: plugins/cloudtalk
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          entries = json.load(open(".grok-plugin/plugin.json")).get("skills", [])
          bad = []
          for e in entries:
              d = pathlib.Path(e)
              f = d / "SKILL.md"
              if not f.is_file():
                  bad.append(f"{e}: no SKILL.md"); continue
              t = f.read_text(encoding="utf-8")
              name = re.search(r"^name: (.+)$", t, re.M)
              desc = re.search(r"^description: (.+)$", t, re.M)
              if not name or name.group(1).strip() != d.name:
                  bad.append(f"{e}: frontmatter name is not {d.name}")
              if not desc or len(desc.group(1)) > 1024:
                  bad.append(f"{e}: description missing or over 1024 characters")
          print("\n".join(bad) or f"{len(entries)} Grok skill entries OK")
          sys.exit(1 if bad else 0)
          PY

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        # Advisory for now — flips to blocking once verified green in CI.
        continue-on-error: true
        run: claude plugin validate .
