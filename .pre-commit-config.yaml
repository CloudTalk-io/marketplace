---
# Documentation: https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      # --allow-missing-credentials keeps this hook from failing on a machine with no AWS credentials
      # file. The honest trade-off: on exactly those machines (every CI runner included) it has nothing
      # to match against and passes vacuously. detect-private-key below is the unconditional guard.
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
